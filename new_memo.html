{% extends "base.html" %}{% block body %}<h1>New Quality Memo</h1><div class="card"><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><div class="grid"><div><label>القسم</label><select name="department" required>{% for d in departments %}<option>{{d}}</option>{% endfor %}</select></div><div><label>رقم المنتج / أمر التشغيل</label><input name="product_ref"></div><div><label>نوع المخالفة</label><input name="defect_type" required></div><div><label>مكان المخالفة</label><input name="location"></div><div><label>درجة الخطورة</label><select name="severity"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select></div><div><label>مهندس الجودة المسؤول</label><select name="owner_engineer_id" required>{% for x in engineers %}<option value="{{x.id}}">{{x.full_name}}</option>{% endfor %}</select></div><div><label>مشرف الجودة المسؤول</label><select name="owner_supervisor_id" required>{% for x in supervisors %}<option value="{{x.id}}">{{x.full_name}}</option>{% endfor %}</select></div></div><label>وصف المشكلة</label><textarea name="description" required></textarea><div class="actions"><button>إنشاء وإرسال للاعتماد</button></div></form></div>{% endblock %}
