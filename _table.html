<table><tr><th>رقم المذكرة</th><th>القسم</th><th>الحالة</th><th>تاريخ الإنشاء</th><th>المُنشئ</th></tr>{% for m in memos %}<tr><td><a href="{{url_for('memo_detail',memo_id=m.id)}}">{{m.memo_no}}</a></td><td>{{m.department}}</td><td><span class="badge">{{m.status}}</span></td><td>{{m.created_at[:16]}}</td><td>{{m.creator_name}}</td></tr>{% else %}<tr><td colspan="5">لا توجد مذكرات حتى الآن.</td></tr>{% endfor %}</table>
